<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad-mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="navy-grad-mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f294a"/>
      <stop offset="100%" stop-color="#061325"/>
    </linearGradient>
    <filter id="shadow-mark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(0, 0)" filter="url(#shadow-mark)">
    <!-- Top-Right Gold Arc -->
    <path d="M 230,95 A 165,165 0 0,1 425,270" fill="none" stroke="url(#gold-grad-mark)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Bottom-Left Navy Arc -->
    <path d="M 282,417 A 165,165 0 0,1 87,242" fill="none" stroke="url(#navy-grad-mark)" stroke-width="28" stroke-linecap="round"/>

    <!-- Open Ledger Book Container -->
    <path d="M 148,155 C 190,140 240,150 256,162 C 272,150 322,140 364,155 C 378,160 384,172 384,188 L 384,332 C 384,346 374,356 360,352 C 322,342 272,352 256,366 C 240,352 190,342 152,352 C 138,356 128,346 128,332 L 128,188 C 128,172 134,160 148,155 Z" fill="url(#navy-grad-mark)"/>

    <!-- Left Page Inner -->
    <path d="M 152,165 C 188,152 236,160 250,170 L 250,346 C 236,336 188,328 152,338 Z" fill="#ffffff"/>

    <!-- Right Page Inner -->
    <path d="M 360,165 C 324,152 276,160 262,170 L 262,346 C 276,336 324,328 360,338 Z" fill="#ffffff"/>

    <!-- Book Center Spine Divider -->
    <path d="M 256,164 L 256,358" stroke="url(#navy-grad-mark)" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Page Content: Large Rupee Symbol ₹ -->
    <g fill="url(#navy-grad-mark)">
      <path d="M 182,205 H 222 V 217 H 182 Z"/>
      <path d="M 182,225 H 222 V 237 H 182 Z"/>
      <path d="M 182,205 H 197 C 215,205 218,218 214,228 C 210,237 198,241 187,241 H 182 V 252 L 210,285 H 191 L 182,274 V 285 H 170 V 205 H 182 Z"/>
      <line x1="170" y1="298" x2="225" y2="298" stroke="url(#navy-grad-mark)" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Right Page Content: Math & Ledger Entry Symbols (+, -, =) -->
    <path d="M 288,210 H 304 V 226 H 288 Z M 292,204 V 232 H 300 V 204 Z" fill="#10b981"/>
    <line x1="316" y1="218" x2="348" y2="218" stroke="url(#navy-grad-mark)" stroke-width="5" stroke-linecap="round"/>

    <rect x="286" y="248" width="18" height="6" rx="2" fill="#ef4444"/>
    <line x1="316" y1="251" x2="348" y2="251" stroke="url(#navy-grad-mark)" stroke-width="5" stroke-linecap="round"/>

    <rect x="286" y="278" width="18" height="4" rx="1" fill="url(#navy-grad-mark)"/>
    <rect x="286" y="286" width="18" height="4" rx="1" fill="url(#navy-grad-mark)"/>
    <line x1="316" y1="284" x2="348" y2="284" stroke="url(#navy-grad-mark)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
